<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>ProximaAI — Parallel AI Generation Cockpit</title>
    <script>
      // Right after a deploy, an edge server can still hand out the previous index.html, whose /assets/* bundle the
      // new deployment no longer serves: a 404 leaves a blank page and the app never runs to show its "New version
      // ready" banner (seen live 2026-10-20). Reload once (after a short wait) to fetch the current HTML; the
      // sessionStorage mark stops a loop if the same file keeps failing. Must stay above Vite's bundle tag.
      addEventListener('error', function (e) {
        var t = e.target, src = (t && (t.src || t.href)) || '';
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') || src.indexOf('/assets/') < 0) return;
        try {
          if (sessionStorage.getItem('proximaai-asset-retry') === src) return;
          sessionStorage.setItem('proximaai-asset-retry', src);
        } catch (_) { return; }
        setTimeout(function () { location.reload(); }, 1500);
      }, true);
    </script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #020510; }
      /* #root must be transparent so the fixed BackgroundLayer (z-index:0) shows through */
      #root { height: 100%; background: transparent; }
      body { font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
